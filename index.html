<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inmobiliaria AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg,#0f172a,#1e293b);
  color: white;
  text-align: center;
}

/* CABECERA */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 30px 60px;
}

.title {
  flex: 1;
  text-align: center;
}

.logo { height: 100px; }
.personaje { height: 180px; }

h1 { margin: 0; font-size: 2.6em; }
p { margin: 5px 0; opacity: 0.9; }

/* TARJETA */
.card {
  max-width: 900px;
  margin: 30px auto;
  background: rgba(255,255,255,0.95);
  color: black;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

button {
  width: 100%;
  padding: 20px;
  margin: 15px 0;
  border: none;
  border-radius: 14px;
  font-size: 22px;
  cursor: pointer;
  transition: 0.3s;
}

.buy { background: #0ea5e9; color: white; }
.sell { background: #16a34a; color: white; }

button:hover { transform: scale(1.03); }

/* FOOTER */
footer {
  margin: 40px 0 20px 0;
  opacity: 0.6;
  font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .header {
    flex-direction: column;
    padding: 20px;
  }

  .logo { height: 70px; }
  .personaje { height: 120px; }

  h1 { font-size: 1.6em; }
  p { font-size: 14px; }

  .card {
    margin: 20px;
    padding: 25px;
  }

  button {
    font-size: 18px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.png" class="logo">
  <div class="title">
    <h1>Plataforma inmobiliaria inteligente</h1>
    <p>Conectamos compradores y propietarios automáticamente</p>
  </div>
  <img src="personaje.png" class="personaje">
</div>

<div class="card">
  <button class="buy" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSd79qQf0Uk4AZHtN0c9cRKsWo_FVLfm_MfXDBKyLjBrBc-mSA/viewform?usp=header')">
    Busco vivienda
  </button>
  
  <button class="sell" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSchc-KqodiryI4wgCo0E7EcNCM5ulvKKnoFeVcL1aWFJ_8qkg/viewform?usp=header')">
    Quiero vender mi inmueble
  </button>

  <button style="background:#f59e0b; color:white;" onclick="window.location.href='simulador-hipoteca.html'">
    Simular mi hipoteca
  </button>
</div>

<footer>
© 2026 Plataforma Inmobiliaria Inteligente  
<br>
<a href="privacidad.html" style="color:white;">Privacidad</a> |
<a href="aviso-legal.html" style="color:white;">Aviso legal</a>
</footer>

<!-- ESTRELLAS -->
<div style="
position: fixed;
bottom: 10px;
right: 15px;
background: rgba(0,0,0,0.4);
padding: 8px 12px;
border-radius: 10px;
font-size: 13px;
color: #facc15;">
Agencia ★★★★☆ 4.3
</div>

</body>
</html>
